<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Glowing background circles -->
  <circle cx="200" cy="150" r="140" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="450" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- Decorative Stars & Particles -->
  <circle cx="150" cy="80" r="4" fill="#fef08a" opacity="0.8"/>
  <circle cx="680" cy="120" r="5" fill="#fef08a" opacity="0.8"/>
  <circle cx="120" cy="480" r="3" fill="#f472b6" opacity="0.8"/>
  <circle cx="720" cy="400" r="4" fill="#38bdf8" opacity="0.8"/>
  
  <polygon points="400,60 405,75 420,80 405,85 400,100 395,85 380,80 395,75" fill="#fbbf24"/>
  <polygon points="650,220 653,230 663,233 653,236 650,246 647,236 637,233 647,230" fill="#c084fc"/>
  <polygon points="140,280 143,290 153,293 143,296 140,306 137,296 127,293 137,290" fill="#34d399"/>

  <!-- Senior Character Caricature Illustration -->
  <g transform="translate(400, 290)">
    <!-- Shadow -->
    <ellipse cx="0" cy="180" rx="140" ry="25" fill="#000" opacity="0.4"/>

    <!-- Cape / Body -->
    <path d="M -110,170 Q 0,110 110,170 L 80,40 Q 0,60 -80,40 Z" fill="url(#accentGrad)"/>
    
    <!-- Trenchcoat / Suit -->
    <path d="M -65,60 L 65,60 L 75,170 L -75,170 Z" fill="#1e293b"/>
    <polygon points="0,60 30,120 0,170 -30,120" fill="#334155"/>
    <polygon points="0,70 12,110 0,140 -12,110" fill="#f59e0b"/>

    <!-- Head / Face -->
    <ellipse cx="0" cy="-10" rx="75" ry="85" fill="#fcd34d"/>
    
    <!-- Cool Sunglasses -->
    <rect x="-60" y="-30" width="52" height="32" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <rect x="8" y="-30" width="52" height="32" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-8" y1="-15" x2="8" y2="-15" stroke="#f59e0b" stroke-width="4"/>
    <!-- Sunglasses Glare -->
    <line x1="-50" y1="-22" x2="-25" y2="-8" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <line x1="18" y1="-22" x2="43" y2="-8" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>

    <!-- Mischief Smile -->
    <path d="M -30,30 Q 0,55 30,30" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 25,25 Q 32,30 28,36" stroke="#78350f" stroke-width="4" fill="none"/>

    <!-- Golden Graduation Cap (Tilted mischievously) -->
    <g transform="rotate(-12, 0, -90)">
      <polygon points="0,-125 110,-90 0,-55 -110,-90" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
      <rect x="-40" y="-80" width="80" height="30" rx="6" fill="#1e293b"/>
      <!-- Golden Tassel -->
      <circle cx="0" cy="-90" r="6" fill="#fbbf24"/>
      <path d="M 0,-90 Q 50,-80 75,-40" stroke="#fbbf24" stroke-width="4" fill="none"/>
      <rect x="70" y="-40" width="10" height="20" rx="3" fill="#f59e0b"/>
    </g>

    <!-- Floating Halo & Code Sparks -->
    <ellipse cx="0" cy="-145" rx="90" ry="20" fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)"/>
  </g>

  <!-- Mischief Badge Ribbon -->
  <g transform="translate(400, 520)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>
    <text x="0" y="6" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="3">
      ✨ 100% CERTIFIED SENIOR MISCHIEF ✨
    </text>
  </g>
</svg>
